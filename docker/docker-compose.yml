version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: atendechat
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  evolution_api:
    image: atendai/evolution-api:latest
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      AUTHENTICATION_API_KEY: changeme
      DATABASE_ENABLED: "false"
    ports:
      - "8080:8080"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: ../apps/backend
    depends_on:
      - postgres
      - redis
      - evolution_api
    environment:
      PORT: 3333
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/atendechat
      JWT_SECRET: supersecret123
      REDIS_URL: redis://redis:6379
      EVOLUTION_API_URL: http://evolution_api:8080
      EVOLUTION_API_KEY: changeme
      EVOLUTION_INSTANCE: atendechat
      FRONTEND_URL: http://localhost:3000
      OLLAMA_URL: http://ollama:11434
    ports:
      - "3333:3333"

  frontend:
    build:
      context: ../apps/frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3333
    ports:
      - "3000:3000"

volumes:
  pg_data:
  ollama_data:
